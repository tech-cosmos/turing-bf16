# Publishes to PyPI when a version tag (v*) is pushed, via PyPI trusted publishing (no API token).
# One-time setup on pypi.org: add a trusted publisher for project "turing-bf16" with this
# repository, workflow "publish.yml" and environment "pypi".
name: publish
on:
  push:
    tags: ["v*"]
jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
