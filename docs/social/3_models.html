<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<style>
.chart { margin-top: 40px; }
.row { display: grid; grid-template-columns: 430px 1fr; align-items: center; height: 76px; }
.lab { font-size: 24px; font-weight: 600; }
.lab small { display: block; font-size: 19px; font-weight: 400; color: var(--text-muted); margin-top: 3px; }
.track { position: relative; height: 36px; }
.base { position: absolute; top: -10px; bottom: -10px; width: 2px; background: var(--bf16); }
.bar { height: 36px; background: var(--tbf16); border-radius: 0 4px 4px 0; }
.val { position: absolute; top: 0; height: 36px; display: flex; align-items: center; padding-left: 14px; font-size: 26px; font-weight: 700; white-space: nowrap; }
.val small { font-size: 19px; color: var(--text-secondary); font-weight: 500; margin-left: 10px; }
.axis { display: grid; grid-template-columns: 430px 1fr; margin-top: 4px; font-size: 18px; color: var(--text-muted); }
.axis div { position: relative; height: 24px; }
.axis span { position: absolute; transform: translateX(-50%); }
</style></head><body class="viz-root"><div class="card">
<div class="eyebrow">turing-bf16 · one line of code</div>
<h1>Up to 7× faster bf16 on Turing</h1>
<div class="sub">Unmodified models on a Tesla T4, vs plain PyTorch bf16. Same accuracy.</div>
<div class="chart" id="chart"></div>
<div class="axis" id="axis"></div>
<div class="legend" style="margin-top:18px"><span><i style="background:var(--tbf16)"></i>speedup with tbf16</span><span><i style="background:var(--bf16);width:4px;border-radius:1px"></i>native bf16 = 1×</span></div>
<div class="foot" style="margin-top:auto"><span>LoRA on RTX 2080 Ti</span><b class="mono">tbf16.convert(model)</b></div>
</div>
<script>
const max = 11.5;
const rows = [
  ["Qwen3-1.7B", "4,096-token prompt", 7.4, "native OOMs at 8k"],
  ["Wan2.1 1.3B text-to-video", "per denoising step, 480p", 6.1, "native OOMs at 81 frames"],
  ["Gemma 3 4B", "2,048-token prompt", 6.0, ".half() → NaN"],
  ["Sana 1600M text-to-image", "per step, 1024×1024", 5.6, "bf16 VAE can't decode"],
  ["UMT5-XXL text encoder", "8 prompts × 512 tokens", 5.3, ""],
  ["LoRA fine-tuning, Qwen3-1.7B", "per training step", 2.6, "same loss curve"],
];
const pct = v => v / max * 100;
document.getElementById("chart").innerHTML = rows.map(([m, d, v, note]) =>
  `<div class="row"><div class="lab">${m}<small>${d}</small></div><div class="track">
     <div class="bar" style="width:${pct(v)}%"></div><div class="base" style="left:${pct(1)}%"></div>
     <div class="val" style="left:${pct(v)}%">${v.toFixed(1)}×${note ? `<small>${note}</small>` : ""}</div></div></div>`).join("");
document.getElementById("axis").innerHTML = `<div></div><div>${[1,2,4,6,8].map(t => `<span style="left:${pct(t)}%">${t}×</span>`).join("")}</div>`;
</script></body></html>
